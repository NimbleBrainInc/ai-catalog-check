name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The SDK cross-check in test/sdk-oracle.test.ts runs only when the SDK is built.
      - run: node scripts/build-sdk.ts
      - run: npm test

  # The action itself, as another repo uses it: the complete fixture passes, and a
  # catalog with a known failure fails.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          catalogs: test/fixtures/complete.json
          profile: nimblebrain
      - id: failing
        uses: ./
        continue-on-error: true
        with:
          catalogs: spec/0.9/examples/ai-catalog.json
      - if: steps.failing.outcome != 'failure'
        run: |
          echo "The action passed a catalog with a known failure (SIG-5)."
          exit 1
